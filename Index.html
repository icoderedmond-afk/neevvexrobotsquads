<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Web-Slinger Rooftop Run</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f2027;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 20;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #ff4d4d;
        }

        #game-over h1 {
            margin: 0 0 10px 0;
            font-size: 36px;
            color: #ff4d4d;
        }

        #game-over p {
            margin: 0;
            font-size: 18px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">Score: <span id="score">0</span></div>
    <div id="game-over">
        <h1>GAME OVER</h1>
        <p>Click or Press Space to Restart</p>
    </div>

    <script>
        let scene, camera, renderer;
        let player, buildings = [];
        let score = 0;
        let isGameOver = false;
        let isSwinging = false;
        let swingTarget = null;
        let swingAngle = 0;
        
        let playerVelocityY = 0;
        const gravity = 0.015;
        const forwardSpeed = 0.3;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f2027);
            scene.fog = new THREE.FogExp2(0x0f2027, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, -10);
            camera.lookAt(0, 2, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, -10);
            scene.add(directionalLight);

            // Create Spider-Man Player Composite Mesh
            player = new THREE.Group();

            const redMaterial = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 });
            const blueMaterial = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.4 });
            const whiteMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });

            // Body / Torso (Blue sides / Red center)
            const bodyGeo = new THREE.CapsuleGeometry(0.5, 0.8, 16, 16);
            const bodyMesh = new THREE.Mesh(bodyGeo, redMaterial);
            bodyMesh.position.y = 0.2;
            player.add(bodyMesh);

            // Head (Red mask)
            const headGeo = new THREE.SphereGeometry(0.4, 32, 32);
            const headMesh = new THREE.Mesh(headGeo, redMaterial);
            headMesh.position.y = 1.0;
            player.add(headMesh);

            // Eyes (Classic white expressive lenses)
            const eyeGeo = new THREE.PlaneGeometry(0.12, 0.06);
            const leftEye = new THREE.Mesh(eyeGeo, whiteMaterial);
            leftEye.position.set(0.12, 1.05, 0.36);
            leftEye.rotation.y = 0.3;
            player.add(leftEye);

            const rightEye = new THREE.Mesh(eyeGeo, whiteMaterial);
            rightEye.position.set(-0.12, 1.05, 0.36);
            rightEye.rotation.y = -0.3;
            player.add(rightEye);

            player.position.set(0, 4, 0);
            scene.add(player);

            for (let i = 0; i < 15; i++) {
                spawnBuilding(i * 12);
            }

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    triggerAction();
                }
            });
            window.addEventListener('mousedown', () => {
                triggerAction();
            });

            animate();
        }

        function spawnBuilding(zPos) {
            const width = 6 + Math.random() * 4;
            const height = 8 + Math.random() * 12;
            const depth = 8;
            const xPos = (Math.random() - 0.5) * 6;

            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x334155, 
                roughness: 0.8 
            });
            const building = new THREE.Mesh(geometry, material);
            building.position.set(xPos, height / 2, zPos);
            building.userData = { passed: false };
            
            scene.add(building);
            buildings.push(building);
        }

        function triggerAction() {
            if (isGameOver) {
                resetGame();
                return;
            }

            let target = buildings.find(b => b.position.z > player.position.z && b.position.z < player.position.z + 25);
            if (target) {
                isSwinging = true;
                swingTarget = target;
                swingAngle = 0;
            }
        }

        function resetGame() {
            score = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('game-over').style.display = 'none';
            
            buildings.forEach(b => scene.remove(b));
            buildings = [];
            
            player.position.set(0, 4, 0);
            playerVelocityY = 0;
            isSwinging = false;
            isGameOver = false;

            for (let i = 0; i < 15; i++) {
                spawnBuilding(i * 12);
            }
        }

        function update() {
            if (isGameOver) return;

            player.position.z += forwardSpeed;

            if (isSwinging && swingTarget) {
                swingAngle += 0.08;
                let radius = 8;
                player.position.y = swingTarget.position.y + Math.sin(swingAngle) * radius;
                player.position.x += (swingTarget.position.x - player.position.x) * 0.1;

                if (swingAngle > Math.PI) {
                    isSwinging = false;
                    playerVelocityY = 0.2;
                }
            } else {
                playerVelocityY -= gravity;
                player.position.y += playerVelocityY;
            }

            if (player.position.y < 0.5) {
                isGameOver = true;
                document.getElementById('game-over').style.display = 'block';
            }

            camera.position.z = player.position.z - 10;
            camera.position.y = player.position.y + 3;
            camera.lookAt(player.position.x, player.position.y, player.position.z + 10);

            for (let i = buildings.length - 1; i >= 0; i--) {
                let b = buildings[i];
                
                if (!b.userData.passed && b.position.z < player.position.z) {
                    score++;
                    document.getElementById('score').innerText = score;
                    b.userData.passed = true;
                }

                if (b.position.z < player.position.z - 15) {
                    scene.remove(b);
                    buildings.splice(i, 1);
                    let maxZ = Math.max(...buildings.map(item => item.position.z));
                    spawnBuilding(maxZ + 12);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
