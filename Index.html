<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-Slinger Rooftop Run</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #game-container {
            text-align: center;
        }

        #ui {
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            width: 1000px;
        }

        canvas {
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            border: 4px solid #ff4d4d;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(255, 77, 77, 0.3);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui">
            <span>Score: <span id="score">0</span></span>
            <span id="instructions">Press <strong>SPACE</strong> or <strong>CLICK</strong> to shoot a web & swing! (Phasing through buildings enabled)</span>
        </div>
        <canvas id="gameCanvas" width="1000" height="500"></canvas>
    </div>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let isGameOver = false;

        let player = {
            x: 150,
            y: 150,
            radius: 15,
            vy: 0,
            vx: 3.5,
            gravity: 0.35,
            isSwinging: false,
            swingAngle: 0,
            anchorPoint: null
        };

        let obstacles = [];
        let obstacleTimer = 0;

        function spawnObstacle(customX = canvas.width) {
            let height = Math.random() * 200 + 80;
            obstacles.push({
                x: customX,
                y: canvas.height - height,
                width: 70,
                height: height,
                passed: false
            });
        }

        spawnObstacle(400);

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                e.preventDefault();
                triggerWeb();
            }
        });

        canvas.addEventListener("mousedown", () => {
            triggerWeb();
        });

        function triggerWeb() {
            if (isGameOver) {
                resetGame();
                return;
            }

            let targetObstacle = obstacles.find(obs => obs.x + obs.width > player.x);
            if (targetObstacle) {
                player.isSwinging = true;
                player.anchorPoint = { x: targetObstacle.x + targetObstacle.width / 2, y: targetObstacle.y };
                
                let dx = player.anchorPoint.x - player.x;
                let dy = player.anchorPoint.y - player.y;
                player.swingAngle = Math.atan2(dy, dx);
            }
        }

        function resetGame() {
            score = 0;
            obstacles = [];
            player.x = 150;
            player.y = 150;
            player.vy = 0;
            player.isSwinging = false;
            isGameOver = false;
            spawnObstacle(400);
            loop();
        }

        function update() {
            if (isGameOver) return;

            obstacleTimer++;
            if (obstacleTimer > 90) {
                spawnObstacle();
                obstacleTimer = 0;
            }

            if (player.isSwinging && player.anchorPoint) {
                player.swingAngle += 0.05;
                let radiusLength = 140;
                player.x += player.vx;
                player.y = player.anchorPoint.y + Math.sin(player.swingAngle) * radiusLength;
                
                if (player.swingAngle > Math.PI) {
                    player.isSwinging = false;
                    player.vy = -4.5;
                }
            } else {
                player.vy += player.gravity;
                player.y += player.vy;
                player.x += player.vx;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= player.vx;

                // Building collision check removed so you phase right through them!

                if (!obstacles[i].passed && obstacles[i].x + obstacles[i].width < player.x) {
                    score++;
                    document.getElementById("score").innerText = score;
                    obstacles[i].passed = true;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            if (player.y > canvas.height - 20) {
                isGameOver = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#334155";
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.fillStyle = "#fbbf24";
                ctx.fillRect(obs.x + 12, obs.y + 20, 10, 18);
                ctx.fillRect(obs.x + 44, obs.y + 20, 10, 18);
                ctx.fillStyle = "#334155";
            });

            if (player.isSwinging && player.anchorPoint) {
                ctx.strokeStyle = "#e2e8f0";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(player.anchorPoint.x, player.anchorPoint.y);
                ctx.stroke();
            }

            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#3b82f6";
            ctx.stroke();

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ffffff";
                ctx.font = "30px 'Segoe UI', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
                
                ctx.font = "16px 'Segoe UI', sans-serif";
                ctx.fillText("Click or press Space to Restart", canvas.width / 2, canvas.height / 2 + 30);
                ctx.textAlign = "left";
            }
        }

        function loop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(loop);
            }
        }

        loop();
    </script>
</body>
</html>
